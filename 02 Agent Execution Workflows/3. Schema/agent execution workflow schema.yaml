# Schema for representing agent execution workflows

workflow_id: string
name: string
description: string
version: string
status: draft | active | deprecated

# Governance and ownership information
metadata:
  domain: string
  owner: string
  last_updated: date
  tags:
    - string

# Workflow objective and success definition
goal:
  description: string
  success_criteria:
    - string

# Information required for execution
inputs:
  required:
    - name: string
      description: string
      type: string
      
 optional:
    - name: string
      description: string
      type: string

# Workflow states
states:
  - state_id: string
    name: string
    description: string
    type:
      - start
      - action
      - decision
      - escalation
      - terminal

# Agent actions
actions:
  - action_id: string
    description: string
    performed_in_state: string

# Decision rules
decision_rules:
  - rule_id: string
    description: string
    condition: string
    outcome: string

# State transitions
transitions:
  - from_state: string
    to_state: string
    condition: string

# Exception handling
exceptions:
  - exception_id: string
    trigger: string
    resolution: string

# Escalation rules
escalation:
  required: boolean
  conditions:
    - string
  target: string

# Terminal outcomes
outcomes:
  - outcome_id: string
    description: string
    type:
      - success
      - denied
      - escalated
      - failed

# Evaluation metrics
evaluation:
  metrics:
    - workflow_completion
    - decision_accuracy
    - required_input_collection
    - escalation_accuracy
